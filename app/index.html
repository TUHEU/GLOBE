<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================================================
       GlobeTrotter Flutter Web
       Base path: /app/
       Build:
       flutter build web --release --base-href /app/
       ========================================================= -->

  <base href="/app/">

  <meta charset="UTF-8">

  <!-- Browser compatibility -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Responsive layout -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <!-- =========================================================
       SEO
       ========================================================= -->

  <title>GlobeTrotter</title>

  <meta
    name="description"
    content="GlobeTrotter - Discover destinations, plan amazing trips, create itineraries and connect with travelers around the world."
  >

  <meta
    name="keywords"
    content="GlobeTrotter, travel, tourism, destinations, trip planner, itinerary, travelers, explore, travel app"
  >

  <meta
    name="author"
    content="GlobeTrotter"
  >

  <!-- =========================================================
       Theme / Mobile
       ========================================================= -->

  <meta
    name="theme-color"
    content="#087F8C"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="GlobeTrotter"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <!-- =========================================================
       Icons
       ========================================================= -->

  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <!-- =========================================================
       PWA Manifest
       ========================================================= -->

  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- =========================================================
       Loading Screen Styles
       ========================================================= -->

  <style>

    /* ---------------------------------------------------------
       Global
       --------------------------------------------------------- */

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #071F2A;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* ---------------------------------------------------------
       Loading screen
       --------------------------------------------------------- */

    #loading-screen {

      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      z-index: 999999;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(35, 210, 200, 0.20),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(0, 130, 180, 0.25),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #062E3A 0%,
          #087F8C 50%,
          #064B68 100%
        );

      opacity: 1;

      visibility: visible;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    #loading-screen.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }

    /* ---------------------------------------------------------
       Loading content
       --------------------------------------------------------- */

    .loading-container {

      width: min(90%, 380px);

      padding: 30px;

      text-align: center;

      box-sizing: border-box;
    }

    /* ---------------------------------------------------------
       Globe icon
       --------------------------------------------------------- */

    .globe-icon {

      width: 86px;
      height: 86px;

      margin: 0 auto 22px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.13);

      border:
        1px solid rgba(255, 255, 255, 0.28);

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.22),
        inset 0 0 25px rgba(255, 255, 255, 0.08);

      animation:
        globe-float 2.5s ease-in-out infinite;
    }

    .globe-icon::before {

      content: "🌎";

      font-size: 46px;

      line-height: 1;
    }

    @keyframes globe-float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* ---------------------------------------------------------
       Logo / title
       --------------------------------------------------------- */

    .loading-title {

      margin: 0;

      color: #FFFFFF;

      font-size: 32px;

      font-weight: 800;

      line-height: 1.2;

      letter-spacing: -0.8px;
    }

    .loading-subtitle {

      margin: 10px 0 30px;

      color:
        rgba(255, 255, 255, 0.78);

      font-size: 14px;

      font-weight: 400;

      line-height: 1.5;
    }

    /* ---------------------------------------------------------
       Spinner
       --------------------------------------------------------- */

    .loading-spinner {

      width: 36px;
      height: 36px;

      margin: 0 auto;

      border-radius: 50%;

      border:
        3px solid rgba(255, 255, 255, 0.20);

      border-top-color:
        #FFFFFF;

      animation:
        loading-spin 0.8s linear infinite;
    }

    @keyframes loading-spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* ---------------------------------------------------------
       Loading message
       --------------------------------------------------------- */

    .loading-text {

      margin-top: 18px;

      color:
        rgba(255, 255, 255, 0.65);

      font-size: 12px;

      line-height: 1.4;

      letter-spacing: 0.2px;
    }

    /* ---------------------------------------------------------
       Small screen
       --------------------------------------------------------- */

    @media (max-width: 480px) {

      .loading-container {
        width: 92%;
        padding: 24px;
      }

      .globe-icon {

        width: 74px;
        height: 74px;

        margin-bottom: 18px;
      }

      .globe-icon::before {
        font-size: 38px;
      }

      .loading-title {
        font-size: 27px;
      }

      .loading-subtitle {
        font-size: 13px;
        margin-bottom: 26px;
      }

      .loading-spinner {
        width: 32px;
        height: 32px;
      }
    }

    /* ---------------------------------------------------------
       Accessibility
       --------------------------------------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .globe-icon,
      .loading-spinner {
        animation: none;
      }

      #loading-screen {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <!-- =========================================================
       GlobeTrotter Loading Screen
       ========================================================= -->

  <div
    id="loading-screen"
    role="status"
    aria-live="polite"
    aria-label="Loading GlobeTrotter"
  >

    <div class="loading-container">

      <div
        class="globe-icon"
        aria-hidden="true"
      ></div>

      <h1 class="loading-title">
        GlobeTrotter
      </h1>

      <p class="loading-subtitle">
        Discover places. Plan trips. Explore the world.
      </p>

      <div
        class="loading-spinner"
        aria-hidden="true"
      ></div>

      <div class="loading-text">
        Loading your adventure...
      </div>

    </div>

  </div>


  <!-- =========================================================
       Flutter Bootstrap
       ========================================================= -->

  <script
    src="flutter_bootstrap.js"
    async
  ></script>


  <!-- =========================================================
       Detect Flutter and remove loading screen
       ========================================================= -->

  <script>

    (function () {

      let loadingHidden = false;

      function hideLoadingScreen() {

        if (loadingHidden) {
          return;
        }

        loadingHidden = true;

        const loadingScreen =
          document.getElementById("loading-screen");

        if (!loadingScreen) {
          return;
        }

        loadingScreen.classList.add("hidden");

        /*
         * Remove the loading screen completely
         * after the fade-out animation.
         */

        setTimeout(function () {

          if (loadingScreen) {
            loadingScreen.remove();
          }

        }, 600);

      }


      /*
       * Flutter normally creates a <flutter-view>
       * element when the application starts.
       */

      const observer =
        new MutationObserver(function () {

          const flutterView =
            document.querySelector("flutter-view");

          const canvas =
            document.querySelector("canvas");

          if (flutterView || canvas) {

            setTimeout(
              hideLoadingScreen,
              250
            );

            observer.disconnect();
          }

        });


      observer.observe(
        document.body,
        {
          childList: true,
          subtree: true
        }
      );


      /*
       * Fallback.
       *
       * If Flutter takes longer than expected,
       * don't leave the user stuck on the loading
       * screen forever.
       */

      setTimeout(
        hideLoadingScreen,
        15000
      );

    })();

  </script>

</body>
</html>
